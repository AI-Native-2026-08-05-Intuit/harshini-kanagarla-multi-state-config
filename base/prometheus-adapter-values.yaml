# base/prometheus-adapter-values.yaml
# TASK 2: map the Micrometer gauge multistate_inflight_requests into the
# Kubernetes custom-metrics API so the HPA (base/50-multistate-api.hpa.yaml)
# can read it. Not applied via Kustomize -- this is a Helm values file for
# `helm install prom-adapter prometheus-community/prometheus-adapter
# --namespace monitoring --values base/prometheus-adapter-values.yaml`
# (W5D5's kube-prometheus-stack.yaml also installs into `monitoring`).
prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc
  port: 9090
rules:
  custom:
    - seriesQuery: 'multistate_inflight_requests{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: namespace}
          pod:       {resource: pod}
      name:
        matches: "multistate_inflight_requests"
        as: "multistate_inflight_requests"
      metricsQuery: 'avg_over_time(multistate_inflight_requests{<<.LabelMatchers>>}[1m])'
