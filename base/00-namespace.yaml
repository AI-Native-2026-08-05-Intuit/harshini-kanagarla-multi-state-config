# base/00-namespace.yaml - the app namespace this workload deploys into.
#
# ResourceQuota + LimitRange used to live here too, but they're
# platform-owned per the AppProject's namespaceResourceBlacklist
# (argocd/projects/multistate.yaml) - the app team's GitOps repo can
# create the namespace and the workloads inside it, but the blast-radius
# caps on that namespace are a platform-team concern applied out-of-band,
# not something this repo's syncPolicy.automated should be able to loosen
# via a commit. Removed here to match; re-added by the platform team's own
# tooling if/when this cluster needs it.
apiVersion: v1
kind: Namespace
metadata:
  name: multistate-dev
  labels:
    app.kubernetes.io/part-of: multistate
