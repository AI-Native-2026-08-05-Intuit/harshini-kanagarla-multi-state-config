# manifests/10-multistate-api.deployment.yaml - the workload.
# Pin the image by tag (NOT a moving label); zero-downtime rollout
# defaults; three-probe pattern; non-root UID from the W5 D1 distroless
# image; envFrom wires both the ConfigMap and Secret.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: multistate-api
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name:       multistate-api
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    multistate
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: multistate-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below `replicas` during a rollout
      maxSurge:       1     # at most one extra pod during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name:      multistate-api    # MUST match selector
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of:   multistate
      annotations:
        # Restart on config / secret content change. CI recomputes this;
        # for local iteration `kubectl rollout restart` is the kill switch.
        checksum/config: "replace-at-apply-time"
        checksum/secret: "replace-at-apply-time"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    65532       # the distroless UID from W5 D1
        fsGroup:      65532
      containers:
        - name:  multistate-api
          image: uptimecrew/multistate-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: multistate-api-config }
            - secretRef:    { name: multistate-api-secrets }
          env:
            # Make the JVM respect the cgroup memory limit, not host RAM.
            - name:  JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

          # ----- resources (requests = scheduler floor; limits = kubelet kill line)
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 1Gi }   # CPU limit omitted on purpose (avoids CFS throttling)

          # ----- three probes ---------------------------------------
          startupProbe:                                  # owns boot grace
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds:    5
            failureThreshold: 30                         # 30 x 5s = 150s grace
            timeoutSeconds:   3
          livenessProbe:                                 # "still alive?"
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    3
            initialDelaySeconds: 0                       # startupProbe owns boot
          readinessProbe:                                # "ready for traffic?"
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds:       5
            timeoutSeconds:      3
            failureThreshold:    3
            successThreshold:    1
            initialDelaySeconds: 0
