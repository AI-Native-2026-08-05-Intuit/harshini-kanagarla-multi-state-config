# manifests/07-kafka.yaml - supporting Kafka for local/CI k3d runs.
# Not one of the multistate-api deliverable objects; needed because
# AllocationCreatedListener's @KafkaListener container starts eagerly
# during context refresh (KafkaListenerEndpointRegistry.start()), which
# needs a resolvable, reachable broker the same way Flyway needs Postgres.
# Single-node KRaft (no Zookeeper) — ephemeral, fine for this lab.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - { name: kafka, containerPort: 9092 }
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.multistate-dev.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: CLUSTER_ID
              value: multistate-dev-kraft-cluster
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
