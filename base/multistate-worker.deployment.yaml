# base/multistate-worker.deployment.yaml - the W6D5 KEDA scale target.
# Same image as multistate-api, run in the "worker" Spring profile:
# consumes tenants.events (consumer group multistate-read-model-builder)
# and re-projects the Mongo read model, no HTTP server. Starts at
# replicas: 0 -- KEDA (multistate-worker-scaledobject.yaml) owns the
# replica count from here; never set both a static replicas count and a
# ScaledObject on the same Deployment, or the two fight over the count.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: multistate-api-worker
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name:       multistate-worker
    app.kubernetes.io/component:  worker
    app.kubernetes.io/part-of:    multistate
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: multistate-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name:      multistate-worker    # MUST match selector
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of:   multistate
      annotations:
        checksum/config: "replace-at-apply-time"
        checksum/secret: "replace-at-apply-time"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    65532
        fsGroup:      65532
      containers:
        - name:  worker
          image: uptimecrew/multistate-api:0.1.0    # same image as the api
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: multistate-api-config }
            - secretRef:    { name: multistate-api-secrets }
          env:
            # Overrides the ConfigMap's SPRING_PROFILES_ACTIVE=k8s: this
            # process runs the worker profile (no HTTP server, and
            # AllocationCreatedListener is @Profile("worker")-gated so
            # only this Deployment consumes tenants.events, never the api).
            - { name: SPRING_PROFILES_ACTIVE, value: worker }
            - name:  JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 1Gi }

          # No HTTP server to probe -- exec probes check the JVM process
          # itself is alive rather than an /actuator/health endpoint.
          startupProbe:
            exec: { command: ["pgrep", "-f", "java"] }
            periodSeconds:    5
            failureThreshold: 30
          livenessProbe:
            exec: { command: ["pgrep", "-f", "java"] }
            periodSeconds:       15
            timeoutSeconds:      3
            failureThreshold:    3
            initialDelaySeconds: 0
