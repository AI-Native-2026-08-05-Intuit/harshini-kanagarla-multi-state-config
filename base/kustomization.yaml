# base/kustomization.yaml - the W5D3 manifests, unmodified, as a Kustomize
# base every overlay patches from. No namespace/replica/profile opinions
# live here - each overlay (dev/staging/prod) supplies its own via
# `namespace:` + strategic-merge patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 05-postgres.yaml
  - 06-mongo.yaml
  - 07-kafka.yaml
  - 08-redis.yaml
  - 10-multistate-api.deployment.yaml
  - 20-multistate-api.service.yaml
  - 30-multistate-api.configmap.yaml
  - 40-multistate-api.secret.yaml
  - 50-multistate-api.hpa.yaml
  - 60-multistate-api.ingress.yaml
  - 65-multistate-api.servicemonitor.yaml
  - multistate-worker.deployment.yaml
  - multistate-worker-scaledobject.yaml
  - pdb.yaml
