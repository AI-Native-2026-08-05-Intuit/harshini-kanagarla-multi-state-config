# argocd-system/notifications-cm.yaml - Argo CD notifications: Slack
# alerts on sync failure and health degradation only.
#
# Deliberately NO on-sync-succeeded trigger/subscription: subscribing
# every Application to it turns every single healthy deploy into a Slack
# message, which nobody reads after the first week and trains the team to
# ignore the channel entirely - exactly the alert-fatigue failure mode
# that makes people miss the on-sync-failed message when it actually
# matters. Silence is the expected, un-alerted state; only failure and
# degradation are worth a page.
#
# The Slack webhook token itself is NEVER committed here - it lives in
# argocd-notifications-secret, created out-of-band:
#   kubectl -n argocd create secret generic argocd-notifications-secret \
#     --from-literal=slack-token=$SLACK_WEBHOOK_URL
# This ConfigMap only references that secret's key by name ($slack-token);
# the notifications-controller resolves it at send time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-cm
    app.kubernetes.io/part-of: argocd
data:
  service.slack: |
    token: $slack-token

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  template.app-sync-failed: |
    message: |
      :x: *{{.app.metadata.name}}* sync failed.
      Revision: {{.app.status.sync.revision}}
      Message: {{.app.status.operationState.message}}

  template.app-health-degraded: |
    message: |
      :warning: *{{.app.metadata.name}}* health degraded.
      Status: {{.app.status.health.status}}

  # Default subscription: every Application labelled team=multistate
  # routes both triggers to #multistate-deploys. Applications opt in via
  # that label rather than an explicit annotation on each one, so a new
  # environment generated by the ApplicationSet (Task 3) inherits
  # notification coverage automatically as long as its template carries
  # the label.
  subscriptions: |
    - recipients:
        - slack:multistate-deploys
      triggers:
        - on-sync-failed
        - on-health-degraded
      selector: team=multistate
