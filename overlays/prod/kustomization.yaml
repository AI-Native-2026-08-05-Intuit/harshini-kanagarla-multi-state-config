# overlays/prod/kustomization.yaml - prod environment overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: multistate-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: multistate-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: k8s,prod
