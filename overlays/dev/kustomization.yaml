# overlays/dev/kustomization.yaml - dev environment overlay.
# namespace: rewrites every namespaced resource's metadata.namespace AND
# the Namespace object's own metadata.name to match - Kustomize's
# namespace transformer covers both, so base's hardcoded `multistate-dev`
# only has to be right for THIS overlay; staging/prod override it below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: multistate-dev

resources:
  - ../../base

# sync-wave: "-1" on the Namespace only (not the whole overlay) - a
# brand-new cluster needs the namespace to exist before the Deployment/
# Service/ConfigMap land in it, so it must sync strictly before wave "0"
# (the ApplicationSet template's own default wave for this environment).
patches:
  - target:
      kind: Namespace
      name: multistate-dev
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  # W6D5: the static replicas patch that used to live here was removed.
  # The HPA (base/50-multistate-api.hpa.yaml, minReplicas: 3) now owns
  # this Deployment's replica count -- a static override here would
  # sync-war with the HPA on every reconcile (same reasoning as never
  # setting replicas on the worker Deployment, which KEDA owns).
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: k8s,dev
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG
