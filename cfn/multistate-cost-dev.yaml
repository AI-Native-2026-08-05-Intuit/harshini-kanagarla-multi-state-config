# cfn/multistate-cost-dev.yaml
# Cost-governance stack over the substrate deployed in W6D3. An AWS
# Budget (tag-scoped) + a CloudWatch billing alarm + an SNS topic.
# This governs AWS-resident spend (NAT gateway, RDS, S3) -- the spend
# AWS billing CAN see. Anthropic (LLM) spend is NOT AWS spend and is
# governed separately (Console spend limit + in-app attribution, see
# multistate-api/COST.md).
#
# Deploy via the W6D3 ChangeSet flow:
#   aws cloudformation create-change-set --stack-name multistate-cost-dev \
#     --change-set-name initial --change-set-type CREATE \
#     --template-body file://cfn/multistate-cost-dev.yaml \
#     --parameters ParameterKey=EnvName,ParameterValue=dev --region us-east-1
AWSTemplateFormatVersion: "2010-09-09"
Description: multistate cost-governance stack -- AWS Budget + billing alarm + SNS.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name (used in resource naming).
  MonthlyBudgetUsd:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 100000
    Description: Monthly cost cap for the tagged stack (dev NAT ~$32 + RDS + S3).
  BillingAlarmUsd:
    Type: Number
    Default: 120
    Description: Account-wide EstimatedCharges guardrail threshold, USD.
  PersonName:
    Type: String
    Default: harshini
    Description: Short per-person suffix so account-unique resource names (SNS topic, Budget, alarm) don't collide with teammates sharing this sandbox account.

Resources:
  CostAlarmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "multistate-cost-alarms-${PersonName}-${EnvName}"
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - {Key: service, Value: multistate}
        - {Key: env,     Value: sandbox}
        - {Key: tenant,  Value: shared}
        - {Key: feature, Value: summarize-nexus}

  # Without this policy, Budgets/CloudWatch silently fail to publish and
  # the notification never arrives -- a "green but dead" trap.
  CostAlarmsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref CostAlarmsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal: {Service: budgets.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref CostAlarmsTopic
          - Sid: AllowCloudWatchPublish
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref CostAlarmsTopic

  # Tag-scoped COST budget: sees ONLY resources tagged service=multistate
  # env=sandbox (the NAT + RDS tagged in the network/app templates). This
  # account's SCP mandates the literal tag value "sandbox" for "env" on
  # every resource, so the cost taxonomy's env dimension reuses that
  # value rather than introducing a second, conflicting "env" meaning.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "multistate-monthly-cost-${PersonName}-${EnvName}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
        CostFilters:
          TagKeyValue:
            - "user:service$multistate"
            - "user:env$sandbox"
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: SNS, Address: !Ref CostAlarmsTopic}
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: SNS, Address: !Ref CostAlarmsTopic}

  # Account-wide guardrail. EstimatedCharges lives only in us-east-1 and
  # cannot be filtered by tag -- that is why the tag-scoped Budget above
  # exists. Billing updates roughly every 6h, so missing data is normal:
  # TreatMissingData: ignore (contrast a metric-pipeline alarm, where
  # silence usually means something is broken and should breach).
  EstimatedChargesAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit name required: the SNS AlarmActions/OKActions wiring
              and this stack's own docs/evidence reference a known, stable
              alarm name rather than a generated one.
    Properties:
      AlarmName: !Sub "multistate/estimated-charges-${PersonName}-${EnvName}"
      AlarmDescription: !Sub "Account-wide EstimatedCharges > ${BillingAlarmUsd} USD."
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - {Name: Currency, Value: USD}
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref BillingAlarmUsd
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: ignore
      ActionsEnabled: true
      AlarmActions: [!Ref CostAlarmsTopic]
      OKActions: [!Ref CostAlarmsTopic]

Outputs:
  CostAlarmsTopicArn:
    Value: !Ref CostAlarmsTopic
    Export: {Name: !Sub "${AWS::StackName}-CostAlarmsTopicArn"}
